name: build flatpak

on:
  pull_request:
    paths:
      - 'flatpak/**'
      - '.github/workflows/build_flatpak.yaml'
      - 'package.json'
      - 'yarn.lock'
      - 'vue.config.js'
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build-flatpak:
    name: Build Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install Dependencies
        run: yarn install --network-timeout 1000000
      - name: Build Unpacked Linux App
        run: |
          yarn gen:version
          yarn vue:electron-build electron:build --linux dir
          mv dist_electron/linux*-unpacked dist_electron/flatpak-unpacked
      - name: Install Flatpak Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Cache flatpak-builder State
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('flatpak/com.emqx.MQTTX.yml') }}
          restore-keys: flatpak-builder-${{ matrix.arch }}-
      - name: Build Flatpak Bundle
        run: |
          version=$(node -p "require('./package.json').version")
          bundle="MQTTX-${version}-${{ matrix.arch }}.flatpak"
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --repo=repo build-dir flatpak/com.emqx.MQTTX.yml
          flatpak build-bundle repo "$bundle" com.emqx.MQTTX \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: ${{ env.BUNDLE }}
      - name: Upload Flatpak to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUNDLE }}
          token: ${{ secrets.GITHUB_TOKEN }}
